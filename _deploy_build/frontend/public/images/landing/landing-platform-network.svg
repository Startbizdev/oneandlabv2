<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Réseau Cary : infirmiers, laboratoires, médecins et patients">
  <defs>
    <linearGradient id="bg3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#E8FBF9"/>
      <stop offset="100%" stop-color="#F4FAFA"/>
    </linearGradient>
    <linearGradient id="hub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2FD4C2"/>
      <stop offset="100%" stop-color="#16B6D6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="24" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg3)"/>
  <circle cx="400" cy="300" r="200" fill="#1CC7B5" opacity="0.06"/>

  <!-- Grid dots -->
  <g opacity="0.25" fill="#1CC7B5">
    <circle cx="80" cy="80" r="2"/><circle cx="128" cy="80" r="2"/><circle cx="176" cy="80" r="2"/>
    <circle cx="624" cy="520" r="2"/><circle cx="672" cy="520" r="2"/><circle cx="720" cy="520" r="2"/>
  </g>

  <!-- Links -->
  <g stroke="#1CC7B5" stroke-width="3" opacity="0.45" stroke-linecap="round">
    <line x1="400" y1="300" x2="200" y2="200"/>
    <line x1="400" y1="300" x2="600" y2="200"/>
    <line x1="400" y1="300" x2="200" y2="400"/>
    <line x1="400" y1="300" x2="600" y2="400"/>
  </g>
  <g fill="#1CC7B5" opacity="0.5">
    <circle cx="300" cy="250" r="5"/><circle cx="500" cy="250" r="5"/>
    <circle cx="300" cy="350" r="5"/><circle cx="500" cy="350" r="5"/>
  </g>

  <!-- Nodes -->
  <g>
    <circle cx="200" cy="200" r="58" fill="#fff" stroke="#1CC7B5" stroke-width="4"/>
    <circle cx="200" cy="200" r="40" fill="#E8FBF9"/>
    <rect x="194" y="172" width="12" height="44" rx="4" fill="#1CC7B5"/>
    <polygon points="188,172 212,172 200,158" fill="#1CC7B5"/>
    <text x="200" y="278" text-anchor="middle" fill="#3D3D52" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Infirmiers</text>
  </g>
  <g>
    <circle cx="600" cy="200" r="58" fill="#fff" stroke="#1678A8" stroke-width="4"/>
    <circle cx="600" cy="200" r="40" fill="#E0F2FA"/>
    <path d="M584 210 h32 v-20 h-12 l-8-12-8 12h-12z" fill="#1678A8"/>
    <text x="600" y="278" text-anchor="middle" fill="#3D3D52" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Laboratoires</text>
  </g>
  <g>
    <circle cx="200" cy="400" r="58" fill="#fff" stroke="#16A34A" stroke-width="4"/>
    <circle cx="200" cy="400" r="40" fill="#F0FDF4"/>
    <circle cx="200" cy="388" r="14" fill="#16A34A"/>
    <path d="M178 408 Q200 430 222 408" fill="none" stroke="#16A34A" stroke-width="8" stroke-linecap="round"/>
    <text x="200" y="478" text-anchor="middle" fill="#3D3D52" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Patients</text>
  </g>
  <g>
    <circle cx="600" cy="400" r="58" fill="#fff" stroke="#6366F1" stroke-width="4"/>
    <circle cx="600" cy="400" r="40" fill="#EEF2FF"/>
    <circle cx="600" cy="392" r="16" fill="#6366F1"/>
    <path d="M576 408 h48" stroke="#6366F1" stroke-width="6" stroke-linecap="round"/>
    <text x="600" y="478" text-anchor="middle" fill="#3D3D52" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Médecins</text>
  </g>

  <!-- Hub -->
  <g filter="url(#glow)">
    <circle cx="400" cy="300" r="72" fill="url(#hub)"/>
    <circle cx="400" cy="300" r="48" fill="#fff"/>
    <path d="M388 300 a28 28 0 1 1 24-18" fill="none" stroke="#1CC7B5" stroke-width="10" stroke-linecap="round"/>
  </g>
  <text x="400" y="395" text-anchor="middle" fill="#0A0A0F" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Cary</text>
</svg>
