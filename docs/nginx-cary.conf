# Nginx Cary — cary.bio (+ www) — production (HTTPS Certbot)
# API : /api/* → backend/index.php
# Déployer : docs/deploy-nginx-cary.sh

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cary.bio www.cary.bio;
    root /var/www/oneandlab;

    ssl_certificate /etc/letsencrypt/live/cary.bio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cary.bio/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/cary-access.log;
    error_log  /var/log/nginx/cary-error.log;

    client_max_body_size 25m;

    location /api {
        client_max_body_size 25m;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/oneandlab/backend/index.php;
        include fastcgi_params;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param SCRIPT_NAME /api;
        fastcgi_read_timeout 300;
    }

    location / {
        client_max_body_size 25m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name cary.bio www.cary.bio;

    client_max_body_size 25m;

    if ($host = www.cary.bio) {
        return 301 https://$host$request_uri;
    }
    if ($host = cary.bio) {
        return 301 https://$host$request_uri;
    }

    return 404;
}
