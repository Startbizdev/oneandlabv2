# Nginx Cary — cary.bio (+ www)
# API : /api/* → backend/index.php
# DNS: A cary.bio + A www.cary.bio → 15.188.11.249
# HTTPS: sudo certbot --nginx -d cary.bio -d www.cary.bio

server {
    listen 80;
    listen [::]:80;
    server_name cary.bio www.cary.bio;
    root /var/www/oneandlab;

    access_log /var/log/nginx/cary-access.log;
    error_log  /var/log/nginx/cary-error.log;

    location /api {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/oneandlab/backend/index.php;
        include fastcgi_params;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param SCRIPT_NAME /api;
        fastcgi_read_timeout 300;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
