<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff"/>

  <!-- Titre -->
  <text x="500" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Cary : architecture de la plateforme</text>

  <!-- Utilisateurs -->
  <rect x="250" y="62" width="400" height="56" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="450" y="86" text-anchor="middle" font-size="16" font-weight="600" fill="#312e81">Utilisateurs</text>
  <text x="450" y="106" text-anchor="middle" font-size="12.5" fill="#3730a3">patients, infirmiers, préleveurs, laboratoires, pharmacies, professionnels</text>

  <!-- Accès -->
  <rect x="190" y="150" width="230" height="58" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="305" y="175" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Applis iPhone et Android</text>
  <text x="305" y="195" text-anchor="middle" font-size="12.5" fill="#475569">React Native / Expo</text>

  <rect x="480" y="150" width="230" height="58" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="595" y="175" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Site web cary.bio</text>
  <text x="595" y="195" text-anchor="middle" font-size="12.5" fill="#475569">Nuxt 3 / Vue.js</text>

  <line x1="380" y1="118" x2="320" y2="148" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="118" x2="580" y2="148" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- AWS -->
  <rect x="30" y="250" width="700" height="420" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="710" y="278" text-anchor="end" font-size="16" font-weight="700" fill="#9a3412">AWS, région Paris : certifiée HDS</text>

  <line x1="305" y1="208" x2="185" y2="312" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="595" y1="208" x2="255" y2="312" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="335" y="238" font-size="12" font-weight="600" fill="#475569">HTTPS (chiffré)</text>

  <!-- Serveur -->
  <rect x="55" y="315" width="650" height="160" rx="12" fill="#ffffff" stroke="#fb923c" stroke-width="1.5"/>
  <text x="75" y="340" font-size="14" font-weight="700" fill="#7c2d12">Serveur applicatif</text>

  <rect x="80" y="355" width="150" height="62" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="155" y="381" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Nginx</text>
  <text x="155" y="400" text-anchor="middle" font-size="11.5" fill="#475569">HTTPS, TLS 1.2 / 1.3</text>

  <rect x="265" y="355" width="180" height="62" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="355" y="381" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">API PHP</text>
  <text x="355" y="400" text-anchor="middle" font-size="11.5" fill="#475569">contrôle des rôles et des droits</text>

  <rect x="480" y="355" width="200" height="62" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="580" y="381" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Base MySQL</text>
  <text x="580" y="400" text-anchor="middle" font-size="11.5" fill="#475569">données sensibles chiffrées</text>

  <line x1="230" y1="386" x2="263" y2="386" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="445" y1="386" x2="478" y2="386" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="80" y="428" width="600" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="380" y="450" text-anchor="middle" font-size="12.5" fill="#334155">Tâches automatiques : RDV, relances, maintenance, durées de conservation · Journal de tous les accès</text>

  <!-- Stockages -->
  <rect x="55" y="500" width="205" height="76" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="157" y="527" text-anchor="middle" font-size="14" font-weight="600" fill="#065f46">Documents (S3)</text>
  <text x="157" y="547" text-anchor="middle" font-size="11.5" fill="#047857">ordonnances, cartes Vitale, photos</text>
  <text x="157" y="564" text-anchor="middle" font-size="11.5" fill="#047857">chiffrés, privés, versionnés</text>

  <rect x="278" y="500" width="205" height="76" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="380" y="527" text-anchor="middle" font-size="14" font-weight="600" fill="#065f46">Sauvegardes (S3)</text>
  <text x="380" y="547" text-anchor="middle" font-size="11.5" fill="#047857">quotidiennes, chiffrées, testées</text>
  <text x="380" y="564" text-anchor="middle" font-size="11.5" fill="#047857">espace séparé et protégé</text>

  <rect x="500" y="500" width="205" height="76" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="602" y="527" text-anchor="middle" font-size="14" font-weight="600" fill="#065f46">Archives (S3)</text>
  <text x="602" y="547" text-anchor="middle" font-size="11.5" fill="#047857">journal d'accès archivé</text>
  <text x="602" y="564" text-anchor="middle" font-size="11.5" fill="#047857">chiffré, conservé</text>

  <line x1="157" y1="475" x2="157" y2="498" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="475" x2="380" y2="498" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="602" y1="475" x2="602" y2="498" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="55" y="596" width="315" height="54" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="212" y="620" text-anchor="middle" font-size="14" font-weight="600" fill="#5b21b6">Coffre-fort de secrets</text>
  <text x="212" y="638" text-anchor="middle" font-size="11.5" fill="#6d28d9">copie chiffrée des clés (AWS KMS)</text>

  <rect x="390" y="596" width="315" height="54" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="547" y="620" text-anchor="middle" font-size="14" font-weight="600" fill="#5b21b6">Supervision</text>
  <text x="547" y="638" text-anchor="middle" font-size="11.5" fill="#6d28d9">surveillance continue, alertes automatiques</text>

  <!-- Services externes -->
  <rect x="760" y="250" width="215" height="420" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="867" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Services externes</text>
  <text x="867" y="296" text-anchor="middle" font-size="11.5" fill="#475569">transmission, pas de stockage</text>
  <text x="867" y="311" text-anchor="middle" font-size="11.5" fill="#475569">du dossier patient</text>

  <g font-size="12.5" fill="#0f172a">
    <rect x="778" y="328" width="179" height="40" rx="7" fill="#fff" stroke="#cbd5e1"/>
    <text x="867" y="345" text-anchor="middle" font-weight="600">Brevo</text>
    <text x="867" y="361" text-anchor="middle" font-size="11" fill="#475569">e-mails et SMS</text>
    <rect x="778" y="376" width="179" height="40" rx="7" fill="#fff" stroke="#cbd5e1"/>
    <text x="867" y="393" text-anchor="middle" font-weight="600">Twilio</text>
    <text x="867" y="409" text-anchor="middle" font-size="11" fill="#475569">SMS de secours</text>
    <rect x="778" y="424" width="179" height="40" rx="7" fill="#fff" stroke="#cbd5e1"/>
    <text x="867" y="441" text-anchor="middle" font-weight="600">Expo</text>
    <text x="867" y="457" text-anchor="middle" font-size="11" fill="#475569">notifications</text>
    <rect x="778" y="472" width="179" height="40" rx="7" fill="#fff" stroke="#cbd5e1"/>
    <text x="867" y="489" text-anchor="middle" font-weight="600">Google Maps</text>
    <text x="867" y="505" text-anchor="middle" font-size="11" fill="#475569">adresses</text>
    <rect x="778" y="520" width="179" height="40" rx="7" fill="#fff" stroke="#cbd5e1"/>
    <text x="867" y="537" text-anchor="middle" font-weight="600">xAI (Grok)</text>
    <text x="867" y="553" text-anchor="middle" font-size="11" fill="#475569">assistant, rétention zéro</text>
    <rect x="778" y="568" width="179" height="56" rx="7" fill="#fff" stroke="#cbd5e1"/>
    <text x="867" y="588" text-anchor="middle" font-weight="600">Stripe, Apple, Google</text>
    <text x="867" y="606" text-anchor="middle" font-size="11" fill="#475569">abonnements</text>
  </g>

  <line x1="705" y1="372" x2="758" y2="372" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
</svg>
